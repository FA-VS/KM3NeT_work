version: v9.2

to_produce:
  - ""

DetIDgroups:
  "D_ORCA006": ["00000049"]
  "D0ORCA010": ["00000100"]
  "D0ORCA011_D1ORCA011": ["00000123","00000132"]

Selector:
  dst_common_path: "/sps/km3net/repo/data_processing/tag/{version}/workdirs/KM3NeT_{detid}/results/{detid}/dst/"
  scores_common_path: "/pbs/home/j/jprado/sps/pid_2_dst/Apply_model/scoreTrees_results/v9.2_newprod/{detid}/"
  output_common_path: ""
  detectors:
    "00000049":
      scores_ttreename: "scores"
      cut: "muonscore<0.01 && noisescore<2.0e-2 && (Evt->trks[0].dir.z>0 || Evt->trks[1].dir.z>0)"
    "00000100":
      scores_ttreename: "scores"
      cut: "muonscore<0.01 && noisescore<2.0e-2 && (Evt->trks[0].dir.z>0 || Evt->trks[1].dir.z>0)"
    "00000123":
      scores_ttreename: "scores"
      cut: "muonscore<0.01 && noisescore<2.0e-2 && (Evt->trks[0].dir.z>0 || Evt->trks[1].dir.z>0)"
    "00000132":
      scores_ttreename: "scores"
      cut: "muonscore<0.01 && noisescore<2.0e-2 && (Evt->trks[0].dir.z>0 || Evt->trks[1].dir.z>0)"

ResponseFunction:
  singularity: "https://sftp.km3net.de/singularity/irf_v0.7.2.sif"
  output_path_json: ""
  output_path_irf: ""
  json_preconfig: "/sps/km3net/users/fvazquez/oscillations/IRF_TTreeCreator_preconfig.json"
  sources_dtype_full: # This governs which sources get processed by IRF
    # data:   "data.jppmuon_jppshower_dynamic.offline.dst"
    mu:     "mc.mupage_default.sirene.jterbr.jppmuon_jppshower_static.offline.dst"
    nu:     "mc.gsg_neutrinos.km3sim_sirene_merged.jterbr.jppmuon_jppshower_static.offline.dst"
    noise:  "mc.pure_noise.jterbr.jppmuon_jppshower_static.offline.dst"
  name: "RF_D0ORCA6_D0ORCA10_D0ORCA11_D1ORCA11_774kton-year"
  exposure: 1.0
  json_args:
    binning:
      E_reco:
        custom: true
        custom_edges: [2.0, 4.0, 5.32086836, 7.07791004, 9.4151569, 12.52420262, 16.65990837, 22.16129485, 29.47933316, 50, 100, 1000]
      Ct_reco:
        custom: false
        nbins: 20
        min: -1.0
        max: +1.0
    classes:
      tracks:
        cuts:
          fixedcut: "Evt.trks[0].dir.z>0 && Evt.trks[0].E>2 && Evt.trks[0].E<50"
      showers:
        cuts:
          fixedcut: "Evt.trks[1].dir.z>0 && Evt.trks[1].E>2 && Evt.trks[1].E<1000"
  detectors:
    "D_ORCA006":
      json_args:
        classes:
          tracks:
            cuts:
              analysis: "noisescore <= 2e-5 && muonscore <= 4.4e-4  && trackscore > 0.75"
              loose_mu:    "noisescore <=2e-4 && muonscore <= 4.4e-3   && trackscore > 0.75"
              loose_noise: "noisescore <=2e-4 && muonscore <= 4.4e-3   && trackscore > 0.75"
          showers:
            cuts:
              analysis: "noisescore <=2e-5 && muonscore <= 4.4e-4  && trackscore < 0.75"
              loose_mu:    "noisescore <=2e-4 && muonscore <= 4.4e-3  && trackscore < 0.75"
              loose_noise: "noisescore <=2e-4 && muonscore <= 4.4e-3  && trackscore < 0.75"
    "D_ORCA010":
      json_args:
        classes:
          tracks:
            cuts:
              analysis: "noisescore <=8.7e-5 && muonscore <= 2.75e-3  && trackscore > {trackscore}"
              loose_mu:    "noisescore <=8.7e-4 && muonscore <=  2.75e-2  && trackscore > {trackscore}"
              loose_noise: "noisescore <=8.7e-4 && muonscore <=  2.75e-2  && trackscore > {trackscore}"
          showers:
            cuts:
              analysis: "noisescore <=8.7e-5 && muonscore <= 2.75e-3  && trackscore < {trackscore}"
              loose_mu:    "noisescore <=8.7e-4 && muonscore <=  2.75e-2  && trackscore < {trackscore}"
              loose_noise: "noisescore <=8.7e-4 && muonscore <=  2.75e-2  && trackscore < {trackscore}"
    "D0ORCA011_D1ORCA011":
      json_args:
        classes:
          tracks:
            cuts:
              analysis: "noisescore <={noisescore} && muonscore <= {muonscore}  && trackscore > {trackscore}"
              loose_mu:    "noisescore <=2e-3 && muonscore <= 3.1e-2  && trackscore > {trackscore}"
              loose_noise: "noisescore <=2e-3 && muonscore <= 3.1e-2  && trackscore > {trackscore}"
          showers:
            cuts:
              analysis: "noisescore <={noisescore} && muonscore <= {muonscore}  && trackscore < {trackscore}"
              loose_mu:    "noisescore <=2e-3 && muonscore <= 3.1e-2  && trackscore < {trackscore}"
              loose_noise: "noisescore <=2e-3 && muonscore <= 3.1e-2  && trackscore < {trackscore}"

Optimization:
  cuts:
    noisescore:
      start: 2e-2
      end: 3e-2
      nsamples: 1
      log: true
    muonscore:
      start: 2e-2
      end: 3e-2
      nsamples: 2
      log: true
    trackscore:
      start: 0.3
      end: 0.8
      nsamples: 2
      log: false


KOFI:
  singularity: "https://sftp.km3net.de/singularity/kofi_v0.10.0.sif"
  flux: "frj-ally-20-01-solmin.dat"
  output:
    common: "774kton-year"
